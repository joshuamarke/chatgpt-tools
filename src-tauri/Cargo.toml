[package]
name = "chatgpt-tools"
version = "1.1.15"
description = "ChatGPT Tools — ChatGPT / Codex desktop toolbox (skins, sessions, more)"
authors = ["chatgpt-tools"]
edition = "2021"

[lib]
name = "chatgpt_tools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
# `devtools`: F12 / open_devtools in debug; release still blocked by webview_guard.
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-process = "2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64 = "0.22"
# Native CDP engine (no system Node for apply/status/inject)
ureq = { version = "2.12", default-features = false, features = ["json", "tls"] }
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
url = "2"
sha2 = "0.10"
hex = "0.4"
parking_lot = "0.12"
# Native .skin / .zip import-export (no Node adm-zip)
zip = { version = "2.2", default-features = false, features = ["deflate"] }
# Local Codex session management (SQLite + backups)
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Provider config (Codex / Grok Build TOML live files)
toml = "0.8"
toml_edit = "0.22"
# Local routing HTTP proxy (Codex / Grok takeover + failover)
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
axum = { version = "0.7", default-features = false, features = ["http1", "tokio", "json"] }
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "http1", "server-auto", "client-legacy"] }
http-body-util = "0.1"
bytes = "1"
futures = "0.3"
async-stream = "0.3"
http = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "socks"] }
tower = "0.5"
once_cell = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
