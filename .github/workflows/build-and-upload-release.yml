name: Build and upload release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build (example v1.1.12)
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-installer:
    name: Windows installer + portable
    runs-on: windows-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.event.release.tag_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      # Same idea as cc-switch: normalize Secret → file/env so Tauri never sees raw newlines
      - name: Prepare Tauri updater signing key
        shell: bash
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          RAW_PASS: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${RAW_KEY}" ]; then
            echo "::error::Missing secret TAURI_SIGNING_PRIVATE_KEY"
            echo "Generate locally: npx tauri signer generate -w keys/chatgpt-tools.key --ci"
            echo "Then set Actions Secret to the .key file contents (single line, NO trailing newline)."
            echo "Do NOT commit keys/ — only the Secret is used in CI."
            exit 1
          fi
          KEY_PATH="${RUNNER_TEMP}/tauri_signing.key"
          # Strip CR/LF/spaces that break base64 decode (error: Invalid symbol 10 = newline)
          ONE=$(printf '%s' "${RAW_KEY}" | tr -d '\r\n[:space:]')
          if [ -z "${ONE}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is empty after stripping whitespace"
            exit 1
          fi
          # Write as one-line .key file (tauri signer --ci format)
          printf '%s' "${ONE}" > "${KEY_PATH}"
          # Prefer path (avoids env multiline / base64 edge cases)
          echo "TAURI_SIGNING_PRIVATE_KEY_PATH=${KEY_PATH}" >> "$GITHUB_ENV"
          # Also provide cleaned single-line value for tools that read the env var
          echo "TAURI_SIGNING_PRIVATE_KEY=${ONE}" >> "$GITHUB_ENV"
          if [ -n "${RAW_PASS}" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=${RAW_PASS}" >> "$GITHUB_ENV"
          fi
          echo "Signing key prepared (len=${#ONE}, path=${KEY_PATH})"

      - name: Stamp repo meta + build Tauri (Windows, signed updater artifacts)
        env:
          # GITHUB_REPOSITORY → default updater latest.json on this repo
          REQUIRE_RELEASE_SECRETS: "1"
          # Optional override; empty → GitHub Releases latest.json
          TAURI_UPDATER_ENDPOINTS: ${{ secrets.TAURI_UPDATER_ENDPOINTS }}
        run: npm run build

      - name: Stage Windows assets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ github.event.inputs.tag || github.event.release.tag_name }}".TrimStart("v", "V")
          $dist = "dist/windows"
          New-Item -ItemType Directory -Force $dist | Out-Null

          $nsisDir = "src-tauri/target/release/bundle/nsis"
          $msiDir = "src-tauri/target/release/bundle/msi"
          $releaseDir = "src-tauri/target/release"
          $exe = Join-Path $releaseDir "chatgpt-tools.exe"

          if (Test-Path $nsisDir) {
            Get-ChildItem $nsisDir -Filter "*.exe" | ForEach-Object {
              $dest = Join-Path $dist "ChatGPTTools-$version-windows-x64-setup.exe"
              Copy-Item $_.FullName $dest -Force
              $sig = "$($_.FullName).sig"
              if (Test-Path $sig) {
                Copy-Item $sig "$dest.sig" -Force
              }
            }
            # Prefer any leftover .sig produced next to nsis outputs
            Get-ChildItem $nsisDir -Filter "*.sig" -ErrorAction SilentlyContinue | ForEach-Object {
              $base = $_.BaseName
              # If already copied as setup.exe.sig skip generic names
              if ($_.Name -notlike "ChatGPTTools-*") {
                $paired = Join-Path $dist "ChatGPTTools-$version-windows-x64-setup.exe.sig"
                if (-not (Test-Path $paired)) {
                  Copy-Item $_.FullName $paired -Force
                }
              }
            }
          }

          if (Test-Path $msiDir) {
            Get-ChildItem $msiDir -Filter "*.msi" | ForEach-Object {
              $dest = Join-Path $dist "ChatGPTTools-$version-windows-x64.msi"
              Copy-Item $_.FullName $dest -Force
              if (Test-Path "$($_.FullName).sig") {
                Copy-Item "$($_.FullName).sig" "$dest.sig" -Force
              }
            }
          }

          # ── Portable (no setup): self-contained folder zip ──
          if (-not (Test-Path $exe)) {
            Write-Error "Missing release binary: $exe"
          }

          $portableRoot = Join-Path $dist "ChatGPTTools-portable"
          $portableApp = Join-Path $portableRoot "ChatGPT Tools"
          if (Test-Path $portableRoot) { Remove-Item $portableRoot -Recurse -Force }
          New-Item -ItemType Directory -Force $portableApp | Out-Null

          Copy-Item $exe (Join-Path $portableApp "ChatGPT Tools.exe") -Force

          # Resources: prefer build outputs, fall back to repo / staged bundle skins
          function Copy-Res([string]$src, [string]$destName) {
            if (Test-Path $src) {
              Copy-Item $src (Join-Path $portableApp $destName) -Recurse -Force
              return $true
            }
            return $false
          }

          $engineOk = $false
          foreach ($cand in @(
            (Join-Path $releaseDir "engine"),
            "engine",
            (Join-Path $releaseDir "resources\engine")
          )) {
            if (Copy-Res $cand "engine") { $engineOk = $true; break }
          }
          if (-not $engineOk) { Write-Error "portable: engine/ missing" }

          $skinsOk = $false
          foreach ($cand in @(
            (Join-Path $releaseDir "skins"),
            "bundle-resources\skins",
            (Join-Path $releaseDir "resources\skins")
          )) {
            if (Copy-Res $cand "skins") { $skinsOk = $true; break }
          }
          if (-not $skinsOk) { Write-Error "portable: skins/ missing (run stage-bundle-skins)" }

          foreach ($cand in @(
            (Join-Path $releaseDir "logo.png"),
            "src\logo.png",
            (Join-Path $releaseDir "resources\logo.png")
          )) {
            if (Copy-Res $cand "logo.png") { break }
          }

          @(
            "ChatGPT Tools portable build",
            "1. Extract the whole folder",
            "2. Run ChatGPT Tools.exe",
            "3. In-app update targets the NSIS installer build; portable users re-download zip",
            "Version: $version"
          ) | Set-Content -Path (Join-Path $portableApp "readme.txt") -Encoding UTF8

          $portableZip = Join-Path $dist "ChatGPTTools-$version-windows-x64-portable.zip"
          if (Test-Path $portableZip) { Remove-Item $portableZip -Force }
          Compress-Archive -Path (Join-Path $portableRoot "*") -DestinationPath $portableZip -Force

          $files = Get-ChildItem $dist -File
          if (-not ($files | Where-Object { $_.Extension -in ".exe", ".msi", ".zip" })) {
            Write-Error "No Windows release assets staged"
          }
          $files | Format-Table Name, Length -AutoSize

      - name: Upload Windows assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.event.release.tag_name }}
          # false: MSI may be absent depending on Tauri bundle targets
          fail_on_unmatched_files: false
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            dist/windows/*.exe
            dist/windows/*.exe.sig
            dist/windows/*.msi
            dist/windows/*.msi.sig
            dist/windows/*-portable.zip

  macos-dmg:
    name: macOS DMG (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
            target: aarch64-apple-darwin
          - arch: x64
            runner: macos-14
            target: x86_64-apple-darwin
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.event.release.tag_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install dependencies
        run: npm ci

      - name: Prepare Tauri updater signing key
        shell: bash
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          RAW_PASS: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${RAW_KEY}" ]; then
            echo "::error::Missing secret TAURI_SIGNING_PRIVATE_KEY"
            exit 1
          fi
          KEY_PATH="${RUNNER_TEMP}/tauri_signing.key"
          ONE=$(printf '%s' "${RAW_KEY}" | tr -d '\r\n[:space:]')
          printf '%s' "${ONE}" > "${KEY_PATH}"
          echo "TAURI_SIGNING_PRIVATE_KEY_PATH=${KEY_PATH}" >> "$GITHUB_ENV"
          echo "TAURI_SIGNING_PRIVATE_KEY=${ONE}" >> "$GITHUB_ENV"
          if [ -n "${RAW_PASS}" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=${RAW_PASS}" >> "$GITHUB_ENV"
          fi
          echo "Signing key prepared (len=${#ONE})"

      - name: Stamp repo meta + build Tauri (macOS ${{ matrix.arch }}, signed)
        env:
          REQUIRE_RELEASE_SECRETS: "1"
          TAURI_UPDATER_ENDPOINTS: ${{ secrets.TAURI_UPDATER_ENDPOINTS }}
        run: |
          node scripts/inject-release-config.mjs
          npx tauri build --target ${{ matrix.target }} --config src-tauri/gen/tauri.release-overlay.json

      - name: Stage macOS assets
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ github.event.inputs.tag || github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          VERSION="${VERSION#V}"
          DIST="dist/macos"
          mkdir -p "$DIST"

          BUNDLE="src-tauri/target/${{ matrix.target }}/release/bundle"
          DMG_DIR="$BUNDLE/dmg"
          APP_DIR="$BUNDLE/macos"
          found=0

          if [ -d "$DMG_DIR" ]; then
            shopt -s nullglob
            for f in "$DMG_DIR"/*.dmg; do
              dest="$DIST/ChatGPTTools-${VERSION}-macos-${{ matrix.arch }}.dmg"
              cp "$f" "$dest"
              if [ -f "${f}.sig" ]; then
                cp "${f}.sig" "${dest}.sig"
              fi
              # Some Tauri versions put .sig beside with same stem
              stem="${f%.dmg}"
              if [ -f "${stem}.sig" ] && [ ! -f "${dest}.sig" ]; then
                cp "${stem}.sig" "${dest}.sig"
              fi
              found=1
            done
            shopt -u nullglob
          fi

          if [ "$found" -eq 0 ] && [ -d "$APP_DIR" ]; then
            shopt -s nullglob
            apps=("$APP_DIR"/*.app)
            shopt -u nullglob
            if [ ${#apps[@]} -gt 0 ]; then
              (
                cd "$APP_DIR"
                zip -r "$OLDPWD/$DIST/ChatGPTTools-${VERSION}-macos-${{ matrix.arch }}.zip" *.app
              )
              found=1
            fi
          fi

          if [ "$found" -eq 0 ]; then
            echo "No macOS release assets under $BUNDLE" >&2
            ls -laR "src-tauri/target/${{ matrix.target }}/release/bundle" || true
            exit 1
          fi

          ls -lh "$DIST"

      - name: Upload macOS assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.event.release.tag_name }}
          fail_on_unmatched_files: false
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            dist/macos/*.dmg
            dist/macos/*.dmg.sig
            dist/macos/*.zip

  latest-json:
    name: Upload Tauri latest.json (+ mirror)
    runs-on: ubuntu-latest
    # Windows is required; macOS optional so a Mac-only failure still ships updater JSON.
    needs:
      - windows-installer
      - macos-dmg
    if: ${{ always() && needs.windows-installer.result == 'success' }}
    steps:
      - name: Checkout (for build-latest-json script)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.event.release.tag_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build + upload latest.json and latest.mirror.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}
          # Optional override; empty → https://ghfast.top/ in the script below
          GITHUB_RELEASE_MIRROR_PREFIX: ${{ secrets.GITHUB_RELEASE_MIRROR_PREFIX }}
        shell: bash
        run: |
          set -euo pipefail
          MIRROR_PREFIX="${GITHUB_RELEASE_MIRROR_PREFIX:-https://ghfast.top/}"
          gh release view "$TAG" --repo "$REPO" --json assets,body,tagName,url,publishedAt > release.json
          mkdir -p dist/sigs
          gh release download "$TAG" --repo "$REPO" --dir dist/sigs --pattern "*.sig" || true
          node scripts/build-latest-json.mjs \
            --repo "$REPO" \
            --tag "$TAG" \
            --release-json release.json \
            --sig-dir dist/sigs \
            --out latest.json \
            --mirror-out latest.mirror.json \
            --mirror-prefix "${MIRROR_PREFIX}"
          echo "=== latest.json (direct GitHub asset URLs) ==="
          cat latest.json
          echo "=== latest.mirror.json (mirrored asset URLs) ==="
          cat latest.mirror.json
          gh release upload "$TAG" latest.json latest.mirror.json --clobber --repo "$REPO"
          echo "::notice::Uploaded latest.json + latest.mirror.json to Release ${TAG}"
